name: Update skyline card
on:
  schedule:
    - cron: "20 16 * * *"   # 16:20 UTC = 00:20 Malaysia time, every day
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the skyline from this year's contributions
        run: python scripts/make_skyline.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
      - name: Commit if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skyline-card.svg skyline.json
          git diff --cached --quiet || git commit -m "chore: refresh skyline card"
          git push
